<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Renderer</title>
    <style>
        body, html { margin: 0; padding: 0; background: #fff; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; }
        .pdf-container { width: 800px; height: 600px; display: flex; align-items: center; justify-content: center; }
        embed { width: 100%; height: 100%; object-fit: contain; }
    </style>
</head>
<body>
    <div class="pdf-container" id="container1">
        <embed src="/Hacksagon.pdf#toolbar=0&navpanes=0&scrollbar=0" type="application/pdf" id="pdf1">
    </div>
    <div class="pdf-container" id="container2">
        <embed src="/Elite-Hack.pdf#toolbar=0&navpanes=0&scrollbar=0" type="application/pdf" id="pdf2">
    </div>
</body>
</html>
